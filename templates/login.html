<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QuizMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <a href="/" class="back-btn"><i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Home</a>

    <div class="auth-card">
        <div class="header">
            <div class="logo-icon"><i data-lucide="lock" style="width: 28px; height: 28px;"></i></div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Continue your learning journey</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Sign In</button>
        </form>

        <div class="footer-links">
            New here? <a href="{{ url_for('signup_page') }}">Create an account</a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
