<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Quiz | QuizMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/setup.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <a href="/" class="back-link">
        <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
        Back to Home
    </a>

    <div class="card">
        <div class="header">
            <div class="icon-circle">
                <i data-lucide="settings-2" style="width: 32px; height: 32px;"></i>
            </div>
            <h1>Configure Quiz</h1>
            <p class="subtitle">Customize your AI learning path</p>
        </div>

        <form method="POST" action="/start_quiz">
            <div class="form-group">
                <label for="topic">Topic of Interest</label>
                <input type="text" id="topic" name="topic" placeholder="e.g. World History, Python, Art" required autofocus>
            </div>

            <div class="form-group">
                <label>Complexity Level</label>
                <div class="difficulty-selector">
                    <div class="diff-option">
                        <input type="radio" name="difficulty" value="easy" id="easy">
                        <label for="easy" class="diff-label">Easy</label>
                    </div>
                    <div class="diff-option">
                        <input type="radio" name="difficulty" value="medium" id="medium" checked>
                        <label for="medium" class="diff-label">Medium</label>
                    </div>
                    <div class="diff-option">
                        <input type="radio" name="difficulty" value="hard" id="hard">
                        <label for="hard" class="diff-label">Expert</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" onclick="flashmsg()">
                Generate Questions
                <i data-lucide="wand-2" style="width: 18px; height: 18px;"></i>
            </button>
        </form>

        {% if error %}
            <div style="margin-top: 20px; padding: 12px; background: #FEF2F2; border: 1px solid #FEE2E2; border-radius: 12px; color: #B91C1C; font-size: 0.85rem; text-align: center; font-weight: 600;">
                {{ error }}
            </div>
        {% endif %}
    </div>
    <div>
    <footer> <p class="copyright">
            © 2026 AI Quiz Master | Built by NomaanShaik09 🚀
        </p>
    </footer>
</div>

    <script>
        lucide.createIcons();
       
function flashmsg() {
    alert("Quiz will generate, please wait...");
}

    </script>
</body>
</html>
