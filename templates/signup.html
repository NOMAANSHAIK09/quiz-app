<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | QuizMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <a href="/" class="back-btn"><i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i> Home</a>

    <div class="auth-card">
        <div class="header">
            <div class="logo-icon"><i data-lucide="user-plus" style="width: 28px; height: 28px;"></i></div>
            <h2>Create Account</h2>
            <p class="subtitle">Join thousands of learners worldwide</p>
        </div>

        <form method="POST" action="/signup">
            <div class="input-group">
                <label for="username">Full Name</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="John Doe" required>
                </div>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit">Get Started</button>
        </form>

        <div class="footer-links">
            Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a>
        </div>
    </div>
    <br/>
    <br/>
    <br/>
    <div><center>
    <footer> <p class="copyright">
            © 2026 AI Quiz Master | Built by NomaanShaik09 🚀
        </p>
    </footer></center>
</div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
