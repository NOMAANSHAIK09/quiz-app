<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <link rel="stylesheet" href="signup.css">
    <style>
        /* body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") no-repeat center/cover;
} */
 body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    background: url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f") no-repeat center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* body::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
} */

.container {
    text-align: center;
    margin-top: 50px;
}

h1 {
    font-size: 32px;
    margin-bottom: 5px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}

.card {
    background: white;
    width: 350px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
}

label {
    display: block;
    text-align: left;
    margin: 10px 0 5px;
    font-weight: bold;
}

.input-box {
    display: flex;
    align-items: center;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 15px;
}

.input-box span {
    margin-right: 10px;
}

.input-box input {
    border: none;
    outline: none;
    width: 100%;
}

.btn {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

.btn:hover {
    background: #2563eb;
}

.login-text {
    margin-top: 15px;
}

.login-text a {
    color: #3b82f6;
    text-decoration: none;
}
@media (max-width: 600px) {

    body {
        height: auto;
        padding: 20px 10px;
        align-items: flex-start;
    }

    .container {
        margin-top: 20px;
    }

    h1 {
        font-size: 24px;
    }

    .subtitle {
        font-size: 14px;
        margin-bottom: 20px;
    }

    .card {
        width: 95%;
        padding: 20px;
        border-radius: 12px;
    }

    label {
        font-size: 14px;
    }

    .input-box {
        padding: 8px;
    }

    .input-box input {
        font-size: 14px;
    }

    .btn {
        padding: 12px;
        font-size: 14px;
    }

    .login-text {
        font-size: 13px;
    }
}
    </style>
</head>
<body>

<div class="container">

    <h1>Create Account</h1>
    <p class="subtitle">Sign up to start taking quizzes</p>

    <div class="card">
        <form method="POST" action="/signup">

            <label>Full Name</label>
            <div class="input-box">
                <span>👤</span>
                <input type="text" name="username" placeholder="John Doe" required>
            </div>

            <label>Email</label>
            <div class="input-box">
                <span>📧</span>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <label>Password</label>
            <div class="input-box">
                <span>🔒</span>
                <input type="password" name="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn">Sign Up</button>

        </form>

        <p class="login-text">
            Already have an account? <a href="{{ url_for('login_page') }}">Login</a>
        </p>
    </div>

</div>

</body>
</html>
