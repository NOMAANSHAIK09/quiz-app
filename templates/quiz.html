<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
   <style>
body {
    font-family: 'Segoe UI', Arial;
    margin: 0;
    padding: 20px;

    background: linear-gradient(135deg, #0f172a, #1e3a8a, #9333ea);
    color: white;
}

/* Glow background effect */
body::before {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: #3b82f6;
    filter: blur(120px);
    top: -100px;
    left: -100px;
    opacity: 0.5;
}

body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: #9333ea;
    filter: blur(120px);
    bottom: -100px;
    right: -100px;
    opacity: 0.5;
}

/* Title */
h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 32px;
}

/* Question Card */
.question-box {
    width: 650px;
    margin: 25px auto;
    padding: 25px;

    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);

    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);

    transition: 0.3s;
}

.question-box:hover {
    transform: translateY(-5px);
}

/* Question */
h3 {
    margin-bottom: 15px;
    color: #e0e7ff;
}

/* Options */
.option {
    display: block;
    margin: 10px 0;
    padding: 12px 15px;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    transition: 0.3s;
}

/* Hover */
.option:hover {
    background: rgba(255,255,255,0.2);
}

/* Radio */
input[type="radio"] {
    margin-right: 10px;
    accent-color: #3b82f6;
}

/* Selected effect */
input[type="radio"]:checked + * {
    font-weight: bold;
}

/* Submit Button */
.submit-btn {
    display: block;
    margin: 40px auto;
    padding: 14px 30px;
    font-size: 16px;

    background: linear-gradient(to right, #3b82f6, #9333ea);
    color: white;

    border: none;
    border-radius: 12px;
    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.submit-btn:hover {
    transform: scale(1.05);
    opacity: 0.9;
}
@media (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .question-box {
        width: 95%;
        padding: 18px;
        border-radius: 15px;
    }

    h3 {
        font-size: 16px;
    }

    .option {
        padding: 10px 12px;
        font-size: 14px;
    }

    input[type="radio"] {
        transform: scale(1.1);
    }

    .submit-btn {
        width: 90%;
        padding: 12px;
        font-size: 14px;
    }
}
</style>
</head>
<body>

<h1 style="text-align:center;">Your Quiz</h1>

<form method="POST" action="/result">

{% for q in questions %}
{% set q_index = loop.index %}

<div class="question-box">

    <h3>Q{{ q_index }}. {{ q.question }}</h3>

    {% for option in q.options %}
    <label class="option">
        <input type="radio" name="q{{ q_index }}" value="{{ option }}" required>
        {{ option }}
    </label>
    {% endfor %}

</div>
{% endfor %}
    <button type="submit" class="submit-btn">Submit Quiz</button>

</form>

</body>
</html>
