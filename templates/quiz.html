<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Quiz | QuizMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/quiz.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="progress-bar" id="progress"></div>

    <div class="header">
        <h1>Active Session</h1>
        <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; font-weight: 600;">
            <i data-lucide="timer" style="width: 18px; height: 18px;"></i>
            <span>{{ questions|length }} Questions</span>
        </div>
    </div>

    <form method="POST" action="/result" class="quiz-container">
        {% for q in questions %}
        {% set q_idx = loop.index %}
        <div class="question-card">
            <div class="question-header">
                <span class="q-badge">{{ q_idx }}</span>
                <h3 class="question-text">{{ q.question }}</h3>
            </div>

            <div class="options-grid">
                {% for opt in q.options %}
                <div class="option-item">
                    <input type="radio" name="q{{ q_idx }}" value="{{ opt }}" id="q{{ q_idx }}_o{{ loop.index }}" required>
                    <label for="q{{ q_idx }}_o{{ loop.index }}" class="option-label">
                        {{ opt }}
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

        <button type="submit" class="submit-btn">
            Complete Quiz
        </button>
    </form>

    <script>
        lucide.createIcons();

        // Simple progress tracking logic
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('input[type="radio"]');
        const progress = document.getElementById('progress');
        const total = {{ questions|length }};

        function updateProgress() {
            const answered = new Set();
            inputs.forEach(i => {
                if(i.checked) answered.add(i.name);
            });
            const pct = (answered.size / total) * 100;
            progress.style.width = pct + '%';
        }

        inputs.forEach(i => i.addEventListener('change', updateProgress));
    </script>
</body>
</html>
