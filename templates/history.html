<!DOCTYPE html>
<html>
<head>
    <title>My Quiz History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            color: #3b82f6;
        }

        .table-container {
            margin: 40px auto;
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #3b82f6;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f5f9;
        }

        .no-data {
            padding: 20px;
            color: #777;
        }

        .back-btn {
            display: inline-block;
            margin: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: #2563eb;
        }
        @media (max-width: 600px) {

    h1 {
        font-size: 22px;
        margin-top: 20px;
    }

    .table-container {
        width: 95%;
        padding: 15px;
        margin: 20px auto;
        border-radius: 12px;
    }

    table {
        font-size: 13px;
    }

    th, td {
        padding: 8px;
    }

    .back-btn {
        padding: 10px 15px;
        font-size: 14px;
    }

    /* Optional: horizontal scroll for table */
    .table-container {
        overflow-x: auto;
    }
}
        
    </style>
</head>
<body>

<h1>📊 My Quiz History</h1>

<div class="table-container">
    {% if scores %}
    <table>
        <tr>
            <th>Topic</th>
            <th>Difficulty</th>
            <th>Score</th>
        </tr>

        {% for s in scores %}
        <tr>
            <td>{{ s.topic }}</td>
            <td>{{ s.difficulty }}</td>
            <td>{{ s.score }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
        <div class="no-data">No quiz history yet 🚀</div>
    {% endif %}
</div>

<a href="/" class="back-btn">🏠 Go Home</a>

</body>
</html>
