<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My History | QuizMaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/history.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="header">
        <h1><i data-lucide="bar-chart-2" style="color: var(--primary);"></i> Performance History</h1>
    </div>

    <div class="table-card">
        {% if scores %}
        <table>
            <thead>
                <tr>
                    <th>Topic</th>
                    <th>Complexity</th>
                    <th>Result</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody>
                {% for s in scores %}
                <tr>
                    <td style="font-weight: 700;">{{ s.topic }}</td>
                    <td>
                        <span class="badge {{ s.difficulty|lower }}">{{ s.difficulty }}</span>
                    </td>
                    <td><span class="score-pill">{{ s.score }}</span></td>
                    <td style="color: var(--text-muted); font-size: 0.85rem;">{{ s.date.strftime('%Y-%m-%d') }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty-state">
            <i data-lucide="inbox" style="width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
            <p>No quiz history found. Start your first session!</p>
        </div>
        {% endif %}
    </div>

    <a href="/" class="back-btn">
        <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
        Return to Dashboard
    </a>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
